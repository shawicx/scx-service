version: '3.8'

# scx-service 生产编排（仅应用容器）
# PG/Redis 由共享基础设施 scx-infra 提供（/opt/scx-infra 下 docker compose up -d）：
#   PostgreSQL：127.0.0.1:5433（库 scx-service，单实例多库）
#   Redis：    127.0.0.1:6388（逻辑 db 1，与 backend=0 / stock=2 隔离）
# host 网络：应用直接监听宿主机 3000 端口（与原 3000:3000 端口映射对外行为一致，
# scx-admin 的 nginx 经 host.docker.internal:3000 反代不受影响）

services:
  app:
    image: scx-service:latest
    container_name: scx-service-app
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
